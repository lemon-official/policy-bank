# Validates the marketplace and every plugin on changes to them.
name: validate-plugins

on:
  pull_request:
    paths:
      - ".claude-plugin/**"
      - "plugins/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@<full-sha>            # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@<full-sha>          # v5
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace and plugins
        run: |
          claude plugin validate --strict .
          for p in plugins/*/; do claude plugin validate --strict "$p"; done
